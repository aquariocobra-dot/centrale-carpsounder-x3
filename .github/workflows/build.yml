name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ranger les fichiers
        run: |
          mkdir -p app/src/main/java/fr/peche/centrale
          cp AlarmService.kt MainActivity.kt app/src/main/java/fr/peche/centrale/
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp app-build.gradle.kts app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: centrale-peche-apk
          path: app/build/outputs/apk/debug/app-debug.apk
